<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='38%25' cy='32%25' r='62%25'%3E%3Cstop offset='0%25' stop-color='%23bb9af7'/%3E%3Cstop offset='55%25' stop-color='%237aa2f7'/%3E%3Cstop offset='100%25' stop-color='%234a6cf7'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23bg)'/%3E%3Cellipse cx='32' cy='32' rx='13' ry='30' fill='none' stroke='%23ffffff' stroke-width='2' stroke-opacity='0.55'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='11' fill='none' stroke='%23ffffff' stroke-width='2' stroke-opacity='0.55'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23ffffff' stroke-width='2' stroke-opacity='0.9'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04040c;--surface:rgba(255,255,255,0.045);--border:rgba(255,255,255,0.09);
  --text:#f0f0ff;--muted:rgba(240,240,255,0.62);--blue:#7aa2f7;--purple:#bb9af7;
  --neon-green:#39ff8f;--neon-orange:#ffb340;--red:#f7768e;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;overflow-x:hidden}
#stars-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(122,162,247,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(122,162,247,.055) 1px,transparent 1px),linear-gradient(rgba(187,154,247,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(187,154,247,.025) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px;
  -webkit-mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,#000 30%,transparent 100%);
  mask-image:radial-gradient(ellipse 85% 85% at 50% 50%,#000 30%,transparent 100%)}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(122,162,247,.08),transparent 70%),radial-gradient(ellipse 45% 38% at 50% 42%,rgba(187,154,247,.07),transparent 65%)}

.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4.5rem 0 2.5rem;gap:1rem}
.page>*{animation:fadeUp .65s ease both}
.page>:nth-child(2){animation-delay:.08s}.page>:nth-child(3){animation-delay:.16s}.page>:nth-child(4){animation-delay:.24s}.page>:nth-child(5){animation-delay:.32s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
@keyframes skSh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes gradFlow{0%{background-position:100% 50%}50%{background-position:0% 50%}100%{background-position:100% 50%}}

/* nav button (same as About Me) */
.about-btn{position:fixed;top:1.1rem;right:1.2rem;z-index:100;display:inline-flex;align-items:center;gap:.4rem;padding:.42rem 1rem;border-radius:10px;
  border:1px solid rgba(122,162,247,.3);background:rgba(8,8,20,.7);backdrop-filter:blur(16px);color:#7aa2f7;
  font-family:'DM Sans',sans-serif;font-weight:600;font-size:.75rem;letter-spacing:.03em;text-decoration:none;transition:all .25s}
.about-btn:hover{border-color:#7aa2f7;background:rgba(122,162,247,.1);color:#a8c4ff;box-shadow:0 0 14px rgba(122,162,247,.35),0 0 28px rgba(122,162,247,.12);transform:translateY(-1px)}
.about-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.name-wrap{width:100%;max-width:700px;display:flex;justify-content:center;padding:0 1.5rem;overflow:hidden}
.name{font-family:'Syne',sans-serif;font-weight:900;font-size:clamp(2.4rem,9vw,5.5rem);letter-spacing:-.02em;line-height:1.05;white-space:nowrap;
  background:linear-gradient(90deg,#fff 0%,#fff 15%,#7aa2f7 30%,#bb9af7 50%,#7aa2f7 70%,#fff 85%,#fff 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradFlow 4s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(155,124,216,.45)) drop-shadow(0 0 36px rgba(122,162,247,.18))}
.stat{display:flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:700;color:var(--neon-green);text-shadow:0 0 12px rgba(57,255,143,.6),0 0 28px rgba(57,255,143,.25)}
.stat-dot{width:7px;height:7px;border-radius:50%;background:var(--neon-green);box-shadow:0 0 8px var(--neon-green),0 0 18px rgba(57,255,143,.5);animation:pulse 2.2s ease-in-out infinite}
.type-cursor{color:var(--neon-green);text-shadow:0 0 8px var(--neon-green);animation:blink .75s step-end infinite;margin-left:1px}

/* carousel */
.carousel{position:relative;width:100%;max-width:1100px}
.viewport{overflow:hidden;width:100%;padding:0 0 6px;touch-action:pan-y;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);user-select:none;-webkit-user-select:none}
.viewport img{-webkit-user-drag:none;pointer-events:none}
.track.drag{transition:none}
.track{display:flex;gap:28px;transition:transform .6s cubic-bezier(.23,1,.32,1);will-change:transform}
.slide{flex:0 0 min(380px,70vw);padding-top:48px;opacity:.55;transform:scale(.92);transition:opacity .5s,transform .5s;cursor:pointer}
.slide:not(.active):hover{opacity:.85}
.slide.active{opacity:1;transform:none;cursor:default}

/* game card */
.game{--c:57,255,143;position:relative;border-radius:18px;text-align:center;border:2px solid rgba(var(--c),.28);
  background:rgba(8,8,20,.82);backdrop-filter:blur(28px);box-shadow:0 0 30px rgba(var(--c),.08),0 0 70px rgba(122,162,247,.06);transition:border-color .3s,box-shadow .3s}
.slide.active .game:hover{border-color:rgba(var(--c),.6);box-shadow:0 0 28px rgba(var(--c),.22),0 0 70px rgba(187,154,247,.12)}
.game.development{--c:255,179,64}.game.deprecated{--c:247,118,142}
.g-clip{position:absolute;inset:0;border-radius:16px;overflow:hidden;pointer-events:none}
.g-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4);opacity:.2}
.g-icon{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;border-radius:22px;z-index:5;border:4px solid #08080f;background:#111128;overflow:hidden;
  box-shadow:0 0 0 2px rgba(var(--c),.4),0 0 22px rgba(var(--c),.25)}
.g-icon img{width:100%;height:100%;object-fit:cover;display:none}
.g-icon.ready img{display:block}
.g-icon.ready .sk{display:none}
.sk{position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,.07) 50%,var(--surface) 75%);background-size:200% 100%;animation:skSh 1.5s ease infinite}
.deprecated .g-icon img{filter:grayscale(.85)}
.g-body{position:relative;z-index:1;padding:56px 20px 0;display:flex;flex-direction:column;gap:12px}
.g-div{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.g-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:#fff;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-group{font-family:'DM Sans',sans-serif;font-size:.74rem;color:var(--muted);margin-top:-8px}
.g-ccu{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid rgba(57,255,143,.35);background:rgba(57,255,143,.07);font-size:.78rem}
.g-ccu b{font-size:1rem;font-variant-numeric:tabular-nums;color:var(--neon-green);text-shadow:0 0 10px rgba(57,255,143,.5)}
.g-ccu small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);animation:pulse 1.6s ease-in-out infinite;flex-shrink:0}
.g-ccu.err{border-color:rgba(247,118,142,.35);background:rgba(247,118,142,.07)}
.g-ccu.err b{color:var(--red);text-shadow:none}.g-ccu.err .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.g-stats{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:11px 0}
.g-stats i{width:1px;height:22px;background:var(--border)}
.g-stat{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:.92rem;color:#fff;font-variant-numeric:tabular-nums}
.ico{width:15px;height:15px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:#fff;stroke:none}

/* status button */
.g-status{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:14px -20px 0;padding:14px;border-top:1px solid rgba(var(--c),.25);border-radius:0 0 16px 16px;
  background:rgba(var(--c),.07);color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.03em;text-decoration:none;transition:background .25s,box-shadow .25s,text-shadow .25s}
a.g-status:hover{background:rgba(var(--c),.16);box-shadow:inset 0 0 22px rgba(var(--c),.12);text-shadow:0 0 10px rgba(var(--c),.7)}
.g-status.off{cursor:default}
.deprecated .g-status{color:rgba(255,255,255,.7)}

/* controls */
.controls{display:flex;align-items:center;gap:14px}
.arrow{width:38px;height:38px;border-radius:12px;border:1px solid rgba(122,162,247,.3);background:rgba(8,8,20,.7);backdrop-filter:blur(16px);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
.arrow:hover{border-color:#7aa2f7;background:rgba(122,162,247,.1);box-shadow:0 0 14px rgba(122,162,247,.35);transform:translateY(-1px)}
.arrow svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:8px}
.dots button{width:8px;height:8px;border-radius:999px;border:0;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dots button.on{width:26px;background:linear-gradient(90deg,#7aa2f7,#bb9af7);box-shadow:0 0 10px rgba(122,162,247,.6)}
/* group stats card */
.page>:nth-child(6){animation-delay:.40s}
.gs{width:min(420px,calc(100vw - 3rem));margin-top:1.5rem}
.gs-card{--c:187,154,247;position:relative;border-radius:18px;text-align:center;border:2px solid rgba(var(--c),.28);background:rgba(8,8,20,.82);backdrop-filter:blur(28px);
  box-shadow:0 0 30px rgba(var(--c),.1),0 0 70px rgba(122,162,247,.07);transition:border-color .3s,box-shadow .3s}
.gs-card:hover{border-color:rgba(var(--c),.6);box-shadow:0 0 28px rgba(var(--c),.24),0 0 70px rgba(122,162,247,.12)}
.gs-body{position:relative;z-index:1;padding:20px 20px 0;display:flex;flex-direction:column;gap:12px}
.gs-stats{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:12px 0}
.gs-stats i{width:1px;height:34px;background:var(--border)}
.gs-stat{display:flex;flex-direction:column;align-items:center;gap:5px}
.gs-stat div{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;color:#fff;font-variant-numeric:tabular-nums}
.gs-stat small,.gs-rev small{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gs-rev{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px -20px 0;padding:14px;border-top:1px solid rgba(57,255,143,.25);border-radius:0 0 16px 16px;background:rgba(57,255,143,.07)}
.gs-rev b{font-family:'Syne',sans-serif;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--neon-green);text-shadow:0 0 10px rgba(57,255,143,.5)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>

<a class="about-btn" href="index.html">
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Home
</a>

<main class="page">
  <div class="name-wrap"><h1 class="name">Projects</h1></div>

  <div class="stat">
    <span class="stat-dot"></span>
    <span><span id="typed"></span><span class="type-cursor">|</span></span>
  </div>

  <div class="carousel">
    <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
  </div>

  <div class="controls">
    <button class="arrow" id="prev" aria-label="Previous game"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Next game"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <!-- Group stats -->
  <div class="gs">
    <div class="gs-card">
      <div class="gs-body">
        <div class="gs-stats">
          <div class="gs-stat">
            <div><svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="gs-visits">—</span></div>
            <small>Total visits</small>
          </div><i></i>
          <div class="gs-stat">
            <div><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.4c2 .8 3.5 2.6 3.5 5.6"/></svg><span id="gs-members">—</span></div>
            <small>Total members</small>
          </div>
        </div>
        <div class="gs-rev">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
          <b id="gs-rev">—</b><small>Revenue generated</small>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
/* ═══════════════════════
   YOUR GAMES — edit this list
   status: 'live' | 'development' | 'deprecated'
   placeId: number from roblox.com/games/XXXXXXX/name (leave '' if not public yet)
   name / group: fallbacks used when there is no placeId or the API fails
═══════════════════════ */
const GAMES = [
  { placeId: '120951586797306', status: 'live' },
  { placeId: '74363261596631', status: 'live' },
  { placeId: '125457235305180', status: 'development', name: 'Build and Kill Brainrots', group: 'Warped.' },
  { placeId: '111816754023206', status: 'development', name: 'The Mystery', group: 'My Garden Business' },
  { placeId: '83867192943537', status: 'development', name: 'My Garden Business', group: 'My Garden Business' },
  { placeId: '79346814697976', status: 'deprecated',  name: 'Survive Brainrot Arena',      group: 'Oracle Productions' },
];
const REFRESH = 30000;

/* ═══════════════════════
   GROUP STATS CARD — edit these
   GROUP_IDS: the number in roblox.com/communities/XXXXXXX/name (add as many as you like)
   REVENUE:   type your own total here, it's not available from any public API
═══════════════════════ */
const GROUP_IDS = ['35993395', '488515568', '492583749', '97331962', '612198374', '1010894035', '832119897', '356716637', '937507114', '621978084'];
const REVENUE   = { value: 70000000, prefix: 'R$' };

/* STARFIELD */
(function(){
  const cv=document.getElementById('stars-canvas'),ctx=cv.getContext('2d');let W,H,stars=[];
  const PALS=[{h:0,s:0},{h:0,s:0},{h:0,s:0},{h:225,s:80},{h:225,s:80},{h:270,s:70},{h:270,s:70}];
  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
  function mk(){const p=PALS[Math.floor(Math.random()*PALS.length)],big=Math.random()<.13;
    return{x:Math.random()*W,y:Math.random()*H,r:big?Math.random()*1.7+1.1:Math.random()*.85+.1,a:Math.random(),
      da:(Math.random()*.007+.002)*(Math.random()<.5?1:-1),vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.06,
      ttl:Math.floor(Math.random()*500+250),age:0,dying:false,p,big}}
  function init(n){stars=[];for(let i=0;i<n;i++){const s=mk();s.age=Math.floor(Math.random()*s.ttl);stars.push(s)}}
  function draw(){ctx.clearRect(0,0,W,H);
    stars.forEach((s,i)=>{s.age++;s.a+=s.da;if(s.a<=.04)s.da=Math.abs(s.da);if(s.a>=1)s.da=-Math.abs(s.da);
      s.x+=s.vx;s.y+=s.vy;if(!s.dying&&s.age>=s.ttl)s.dying=true;
      if(s.dying){s.a-=.015;if(s.a<=0){stars[i]=mk();return}}
      const a=Math.max(0,Math.min(1,s.a));
      const col=s.p.s>0?`hsla(${s.p.h},${s.p.s}%,85%,${a})`:`rgba(255,255,255,${a})`;
      ctx.save();
      if(s.big){const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5.5),gc=s.p.s>0?`hsla(${s.p.h},${s.p.s}%,85%,`:'rgba(200,215,255,';
        g.addColorStop(0,gc+a*.65+')');g.addColorStop(.38,gc+a*.1+')');g.addColorStop(1,gc+'0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,s.r*5.5,0,Math.PI*2);ctx.fill()}
      ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore()});
    requestAnimationFrame(draw)}
  resize();init(380);draw();addEventListener('resize',()=>{resize();init(380)});
})();

/* TYPING LINE (same cursor as the home page) */
(function(){
  const el=document.getElementById('typed'),W=['Roblox Game Projects'];
  let w=0,c=0,del=false;
  (function tick(){const s=W[w];
    if(!del){el.textContent=s.slice(0,++c);if(c===s.length){del=true;return setTimeout(tick,1800)}}
    else{el.textContent=s.slice(0,--c);if(c===0){del=false;w=(w+1)%W.length;return setTimeout(tick,250)}}
    setTimeout(tick,del?30:55)})();
})();

/* CAROUSEL + ROBLOX DATA */
(function(){
  const ICO={
    arrow:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>',
    people:'<svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.4c2 .8 3.5 2.6 3.5 5.6"/></svg>',
    star:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
    play:'<svg class="ico fill" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>',
    tool:'<svg class="ico" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>',
    lock:'<svg class="ico" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
  };
  const STATUS={
    live:{label:'Play on Roblox',icon:ICO.play},
    development:{label:'In Development',icon:ICO.tool},
    deprecated:{label:'Deprecated',icon:ICO.lock}
  };
  const track=document.getElementById('track'),dotsEl=document.getElementById('dots'),vp=document.getElementById('viewport');
  const nf=new Intl.NumberFormat('en-US');
  const compact=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':nf.format(n);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* build slides */
  GAMES.forEach((g,i)=>{
    const st=STATUS[g.status]||STATUS.live, k=STATUS[g.status]?g.status:'live';
    const btn=k==='live'&&g.placeId
      ?`<a class="g-status" href="https://www.roblox.com/games/${esc(g.placeId)}" target="_blank" rel="noopener">${st.icon}${st.label}</a>`
      :`<div class="g-status off">${st.icon}${st.label}</div>`;
    const s=document.createElement('div');
    s.className='slide';
    s.innerHTML=`<div class="game ${k}">
      <div class="g-clip"><div class="g-bg"></div></div>
      <div class="g-icon"><span class="sk"></span><img alt="" /></div>
      <div class="g-body">
        <div class="g-div"></div>
        <div class="g-name" data-f="name">${esc(g.name||'Loading…')}</div>
        <div class="g-group" data-f="group">${esc(g.group||'—')}</div>
        <div class="g-ccu" data-f="box"><span class="dot"></span>${ICO.arrow}<b data-f="ccu">—</b><small>playing now</small></div>
        <div class="g-stats">
          <div class="g-stat">${ICO.people}<span data-f="visits">—</span></div><i></i>
          <div class="g-stat">${ICO.star}<span data-f="favs">—</span></div>
        </div>
        ${btn}
      </div></div>`;
    s.addEventListener('click',()=>{if(!moved&&idx!==i)go(i)});
    track.appendChild(s);
    const d=document.createElement('button');d.setAttribute('aria-label','Game '+(i+1));d.onclick=()=>go(i);dotsEl.appendChild(d);
  });
  const slides=[...track.children],dots=[...dotsEl.children];
  const f=(i,k)=>slides[i].querySelector(`[data-f=${k}]`);

  /* navigation */
  let idx=0,timer,hover=false,x0=null,dx=0,moved=false;
  const GAP=28,AUTO=6000;
  const place=extra=>{const w=slides[0].offsetWidth;
    track.style.transform=`translateX(${vp.clientWidth/2-(idx*(w+GAP)+w/2)+extra}px)`};
  const stop=()=>clearInterval(timer);
  const start=()=>{stop();if(slides.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)
    timer=setInterval(()=>go(idx+1),AUTO)};
  function go(n){
    idx=(n+slides.length)%slides.length;
    place(0);
    slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
    dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
    if(!hover&&x0===null)start();
  }
  document.getElementById('prev').onclick=()=>go(idx-1);
  document.getElementById('next').onclick=()=>go(idx+1);
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});
  addEventListener('resize',()=>go(idx));
  vp.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;moved=false;stop()});
  addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;
    if(Math.abs(dx)>6){moved=true;track.classList.add('drag');place(dx)}});
  const release=()=>{if(x0===null)return;const d=dx;x0=null;track.classList.remove('drag');
    go(idx+(moved&&Math.abs(d)>(slides[0].offsetWidth+GAP)*.18?(d<0?1:-1):0))};
  addEventListener('pointerup',release);addEventListener('pointercancel',release);
  vp.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>30){e.preventDefault();go(idx+(e.deltaX>0?1:-1))}},{passive:false});
  vp.addEventListener('mouseenter',()=>{hover=true;stop()});
  vp.addEventListener('mouseleave',()=>{hover=false;start()});
  document.fonts.ready.then(()=>go(0));go(0);

  /* count-up */
  function countTo(el,to,fmt=nf.format){
    const from=parseInt(el.dataset.v||'0',10);el.dataset.v=to;const t0=performance.now();
    (function step(now){const p=Math.min(1,(now-t0)/900),e=1-Math.pow(1-p,3);
      el.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)})(t0);
  }

  /* Roblox APIs (via RoProxy — Roblox blocks direct browser requests) */
  const API={
    universe:id=>`https://apis.roproxy.com/universes/v1/places/${id}/universe`,
    games:ids=>`https://games.roproxy.com/v1/games?universeIds=${ids.join(',')}`,
    icons:ids=>`https://thumbnails.roproxy.com/v1/games/icons?universeIds=${ids.join(',')}&size=512x512&format=Png&isCircular=false`
  };
  const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const uid={};let iconsDone=false;

  async function update(){
    const idxs=GAMES.map((g,i)=>g.placeId?i:-1).filter(i=>i>=0);
    if(!idxs.length){GAMES.forEach((_,i)=>f(i,'box').classList.add('err'));return}
    try{
      await Promise.all(idxs.filter(i=>!uid[i]).map(async i=>{
        try{uid[i]=(await getJSON(API.universe(GAMES[i].placeId))).universeId}catch(e){console.warn('universe',i,e)}}));
      const ok=idxs.filter(i=>uid[i]);
      const data=(await getJSON(API.games(ok.map(i=>uid[i])))).data||[];
      idxs.forEach(i=>{
        const g=data.find(d=>d.id===uid[i]);
        if(!g){f(i,'box').classList.add('err');return}
        f(i,'name').textContent=GAMES[i].name||g.name;
        f(i,'group').textContent=GAMES[i].group||g.creator?.name||'';
        countTo(f(i,'ccu'),g.playing||0);
        countTo(f(i,'visits'),g.visits||0,compact);
        countTo(f(i,'favs'),g.favoritedCount||0,compact);
        f(i,'box').classList.remove('err');
      });
      if(!iconsDone){
        const ic=(await getJSON(API.icons(ok.map(i=>uid[i])))).data||[];
        ic.forEach(o=>{
          const i=ok.find(i=>uid[i]===o.targetId);if(i===undefined||!o.imageUrl)return;
          const wrap=slides[i].querySelector('.g-icon'),img=wrap.querySelector('img');
          img.onload=()=>wrap.classList.add('ready');img.src=o.imageUrl;
          slides[i].querySelector('.g-bg').style.backgroundImage=`url(${o.imageUrl})`;
        });
        iconsDone=true;
      }
    }catch(e){console.warn('Roblox API',e);idxs.forEach(i=>f(i,'box').classList.add('err'))}
    GAMES.forEach((g,i)=>{if(!g.placeId)f(i,'box').classList.add('err')});
  }
  update();setInterval(update,REFRESH);
})();

/* GROUP STATS — totals only (group names, icons and links are intentionally not shown) */
(function(){
  const REFRESH_MS = 5*60*1000;   // normal refresh
  const RETRY_MS   = 20*1000;     // retry sooner when some requests failed
  const $=id=>document.getElementById(id);
  const visEl=$('gs-visits'),memEl=$('gs-members'),revEl=$('gs-rev');
  const nf=new Intl.NumberFormat('en-US');
  const compact=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':nf.format(n);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  let tok=0;
  function countTo(el,to,fmt=nf.format){
    if(String(to)===el.dataset.v)return;             // unchanged: don't re-animate
    const from=parseInt(el.dataset.v||'0',10),my=el._t=++tok;el.dataset.v=to;const t0=performance.now();
    (function step(now){if(el._t!==my)return;         // a newer animation took over
      const p=Math.min(1,(now-t0)/900),e=1-Math.pow(1-p,3);
      el.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)})(t0);
  }
  countTo(revEl,REVENUE.value,n=>REVENUE.prefix+nf.format(n));

  const ids=GROUP_IDS.map(String).filter(x=>/^\d+$/.test(x));
  if(!ids.length)return;

  /* fetch with retries — RoProxy rate-limits (429) when many groups are requested at once */
  async function get(u){
    for(let t=0;t<4;t++){
      try{
        const r=await fetch(u);
        if(r.ok)return await r.json();
        if(r.status!==429&&r.status<500)break;
      }catch(e){}
      await sleep(1500*(t+1));
    }
    throw new Error('request failed');
  }
  async function pool(list,n,fn){
    const q=[...list];
    await Promise.all(Array.from({length:n},async()=>{while(q.length)await fn(q.shift())}));
  }

  /* last known good values — a failed request can never lower a total */
  const members={},games={},visits={};

  async function groupGames(id){
    const out=[];let cur='';
    do{
      const j=await get(`https://games.roproxy.com/v2/groups/${id}/games?accessFilter=2&limit=100${cur?'&cursor='+encodeURIComponent(cur):''}`);
      (j.data||[]).forEach(x=>out.push(x.id));cur=j.nextPageCursor||'';
    }while(cur);
    return out;                                        // only returned if every page loaded
  }

  async function load(){
    await pool(ids,3,async id=>{
      try{members[id]=(await get(`https://groups.roproxy.com/v1/groups/${id}`)).memberCount||0}catch(e){console.warn('members',id)}
      try{games[id]=await groupGames(id)}catch(e){console.warn('games',id)}
    });
    const all=[...new Set(Object.values(games).flat())];   // shared games are counted once
    for(let i=0;i<all.length;i+=50){
      const chunk=all.slice(i,i+50);
      try{
        const d=(await get(`https://games.roproxy.com/v1/games?universeIds=${chunk.join(',')}`)).data||[];
        chunk.forEach(u=>{if(!(u in visits))visits[u]=0});
        d.forEach(x=>{visits[x.id]=Math.max(visits[x.id]||0,x.visits||0)});   // visits never go down
      }catch(e){console.warn('visits chunk')}
    }
    /* only show a total once EVERY group has reported, so it never shows a partial sum */
    const memOk=ids.every(id=>id in members);
    const visOk=ids.every(id=>games[id])&&all.every(u=>u in visits);
    if(memOk)countTo(memEl,ids.reduce((a,id)=>a+members[id],0));
    if(visOk)countTo(visEl,all.reduce((a,u)=>a+visits[u],0),compact);
    setTimeout(load,memOk&&visOk?REFRESH_MS:RETRY_MS);
  }
  load();
})();
</script>
</body>
